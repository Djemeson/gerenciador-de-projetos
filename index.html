<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gerenciador de Projetos</title>

    <!-- App instalável. `theme-color` começa na cor do tema escuro (o padrão do app) e é
         reajustada por src/lib/pwa.ts quando o tema muda. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#08090C" />
    <meta name="description" content="Espaços, projetos, tarefas e metas — no computador e no celular, sempre em dia." />

    <!-- iOS não lê o manifesto: nome, ícone e barra de status vêm destas metas. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Projetos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
